<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Loom — projector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Quicksand:wght@400;500;600;700&display=swap">
<style>
  :root{
    /* cloudy white: pearl over highlight, never flat paper */
    --cloud-0:#fbfcfe; --cloud-1:#f1f4fa; --cloud-2:#e7edf7; --cloud-3:#dae3f0;
    --mist:#b9c7dc; --ink:#333f52; --ink-2:#6c7c93; --ink-3:#93a2b8;

    --story:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
    --soft:'Quicksand','Nunito','Segoe UI',system-ui,sans-serif;
    --fs:clamp(20px,1.72vw,33px);      /* story size — projector-first, readable across a room */
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--cloud-1);color:var(--ink);font-family:var(--story);
    overflow:hidden;height:100dvh;display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased}

  /* ---------- drifting cloud field ----------
     Three oversized, heavily-feathered blooms on slow offset loops. This is the whole
     atmosphere; everything else sits quietly on top of it. */
  #sky{position:fixed;inset:-25%;z-index:0;pointer-events:none;filter:blur(46px);opacity:.85}
  #sky i{position:absolute;display:block;border-radius:50%}
  #sky i:nth-child(1){width:58vw;height:58vw;left:-6%;top:-8%;
    background:radial-gradient(circle at 40% 40%,#ffffff,rgba(214,228,247,.55) 55%,transparent 72%);
    animation:drift1 74s ease-in-out infinite}
  #sky i:nth-child(2){width:66vw;height:66vw;right:-12%;top:8%;
    background:radial-gradient(circle at 55% 45%,#ffffff,rgba(233,224,247,.5) 52%,transparent 70%);
    animation:drift2 91s ease-in-out infinite}
  #sky i:nth-child(3){width:74vw;height:74vw;left:14%;bottom:-30%;
    background:radial-gradient(circle at 50% 50%,#ffffff,rgba(249,231,224,.42) 50%,transparent 70%);
    animation:drift3 108s ease-in-out infinite}
  @keyframes drift1{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(7vw,5vh,0) scale(1.14)}}
  @keyframes drift2{0%,100%{transform:translate3d(0,0,0) scale(1.06)}50%{transform:translate3d(-8vw,7vh,0) scale(.94)}}
  @keyframes drift3{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(5vw,-6vh,0) scale(1.1)}}

  /* ---------- masthead ---------- */
  header{position:relative;z-index:2;flex:none;display:flex;align-items:center;gap:18px;
    padding:22px 38px 14px}
  .wordmark{font-family:var(--soft);font-weight:600;font-size:19px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:11px}
  /* the pip breathes while the loom is alive; it stops when the stream drops */
  .pip{width:9px;height:9px;border-radius:50%;background:var(--mist);
    box-shadow:0 0 0 0 rgba(158,180,210,.6);animation:breathe 3.4s ease-in-out infinite}
  .pip.live{background:#a8c6a0;box-shadow:0 0 0 0 rgba(168,198,160,.55)}
  .pip.down{background:#e3b0b0;animation:none}
  @keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(168,198,160,.5)}50%{box-shadow:0 0 0 9px rgba(168,198,160,0)}}
  .spacer{flex:1}
  .meta{font-family:var(--soft);font-weight:500;font-size:17px;color:var(--ink-3);letter-spacing:.06em}

  /* ---------- layout ---------- */
  #main{position:relative;z-index:1;flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;
    gap:60px;min-height:0;padding:0 46px 30px;width:100%;max-width:1560px;margin:0 auto}

  /* ---------- story ---------- */
  #story{overflow-y:auto;padding:7vh 8px 34vh 8px;scrollbar-width:none;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 10%,#000 86%,transparent 100%);
    mask-image:linear-gradient(to bottom,transparent 0,#000 10%,#000 86%,transparent 100%)}
  #story::-webkit-scrollbar{display:none}
  .para{font-size:var(--fs);line-height:1.62;font-weight:400;color:var(--ink);
    margin:0 auto .85em;max-width:44ch;letter-spacing:-.004em;
    transition:color .8s ease,opacity .8s ease}
  /* settled paragraphs recede a little so the live one is unmistakably the front of the weave */
  .para.settled{color:#5d6b81;opacity:.82}
  /* the live paragraph sits in its own soft cloud, lifted off the field */
  .para.live{background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.66));
    border-radius:34px;padding:.72em .95em;max-width:45ch;
    box-shadow:0 3px 16px rgba(120,142,178,.10),0 18px 54px rgba(120,142,178,.13),
      inset 0 1px 0 rgba(255,255,255,.9);
    animation:settle .9s cubic-bezier(.22,1,.36,1)}
  @keyframes settle{from{transform:translateY(7px) scale(.992);opacity:.55}to{transform:none;opacity:1}}
  .para.rejected{animation:letgo 1.5s ease}
  @keyframes letgo{0%,100%{box-shadow:0 3px 16px rgba(120,142,178,.10),0 18px 54px rgba(120,142,178,.13)}
    45%{box-shadow:0 0 0 5px rgba(200,214,234,.5),0 18px 54px rgba(120,142,178,.13)}}
  /* before the room has thrown in anything, the live paragraph is this line instead of empty prose */
  .para.gathering{text-align:center;font-style:italic;color:var(--ink-2)}

  /* an already-settled paragraph being deliberately revised — a warm ring, deliberately outside the
     contributor palette so it never reads as attribution */
  .para.retro{border-radius:28px;padding:.5em .7em;margin:0 auto .85em;
    animation:revise 2.2s ease-in-out infinite}
  @keyframes revise{
    0%,100%{box-shadow:0 0 0 2px color-mix(in srgb,#d8a24a 35%,transparent),
      0 3px 14px color-mix(in srgb,#d8a24a 10%,transparent)}
    50%{box-shadow:0 0 0 2.5px color-mix(in srgb,#d8a24a 65%,transparent),
      0 3px 16px color-mix(in srgb,#d8a24a 22%,transparent)}}
  /* a downstream paragraph quietly re-absorbing an earlier edit — much quieter than a deliberate one */
  .para.rippling{animation:flicker 1.8s ease-in-out infinite}
  @keyframes flicker{0%,100%{opacity:.82}50%{opacity:.58}}
  /* one-shot flash the instant a deliberate edit lands, so it reads differently from an ordinary commit */
  .para.landed{animation:land 1.1s ease}
  @keyframes land{
    0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,#d8a24a 0%,transparent)}
    35%{box-shadow:0 0 0 8px color-mix(in srgb,#d8a24a 30%,transparent)}}

  /* ---------- condensation ----------
     A position's token is vapour the step it changes and hardens as it holds. Glyphs are drawn
     by text-shadow while vapour: an inline filter fragments across line breaks, and 256 shadowed
     spans stay cheap on the projector machine. --vap is the contributor colour where one owns
     the position, otherwise the mist. */
  .tk{--vap:#aebfd6;transition:color .55s ease,text-shadow .55s ease,opacity .55s ease}
  .v0{color:transparent;text-shadow:0 0 11px var(--vap);opacity:.58}
  .v1{color:transparent;text-shadow:0 0 6px var(--vap);opacity:.76}
  .v2{color:var(--vap);text-shadow:0 0 3px rgba(255,255,255,.7);opacity:.62}
  .v3{color:var(--ink-2);opacity:.86}
  .fz{color:var(--ink);opacity:1}

  /* a contributor's words, wherever they surface — the one place colour is allowed */
  .who{border-radius:.6em;padding:.02em .22em;margin:0 -.02em;font-weight:700;
    background:color-mix(in srgb,var(--c) 13%,transparent);
    box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 16%,transparent);
    color:color-mix(in srgb,var(--c) 78%,#2b3547)}
  /* A pin spans several canvas positions, so its run is drawn as one continuous mark: only the
     ends are rounded and the leading space of each token carries the tint across the gap.
     Pins never renoise, so they stay solid from step 0 rather than condensing like the rest —
     the room's own words are already certain, and the model weaves around them. */
  .tk.pin{background:color-mix(in srgb,var(--c) 14%,transparent);font-weight:700;opacity:1;
    color:color-mix(in srgb,var(--c) 80%,#2b3547);text-shadow:none;padding:.08em 0;border-radius:0}
  .tk.pin.rs{border-radius:.5em 0 0 .5em;padding-left:.12em}
  .tk.pin.re{border-radius:0 .5em .5em 0;padding-right:.16em}

  /* ---------- the illustration ----------
     One still, for whichever paragraph is currently live — a companion to the scene, not a video.
     It only ever changes on an `image` event, so a crossfade is the whole animation it needs. */
  #illus{position:relative;width:100%;aspect-ratio:4/3;border-radius:26px;overflow:hidden;
    margin-bottom:22px;background:linear-gradient(155deg,var(--cloud-2),var(--cloud-3));
    box-shadow:0 3px 16px rgba(120,142,178,.10),0 18px 54px rgba(120,142,178,.13),
      inset 0 1px 0 rgba(255,255,255,.9);display:none}
  #illus.on{display:block}
  #illus img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    opacity:0;transition:opacity .4s ease}
  #illus .cap{position:absolute;left:0;right:0;bottom:0;padding:9px 16px;font-family:var(--soft);
    font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#fff;
    background:linear-gradient(0deg,rgba(30,38,54,.55),transparent)}

  /* ---------- the queue, as bubbles ----------
     One bubble is one phrase somebody in the room is waiting on. */
  #rail{display:flex;flex-direction:column;min-height:0;padding-top:14px}
  .rail-h{font-family:var(--soft);font-weight:600;font-size:13.5px;letter-spacing:.15em;
    text-transform:uppercase;color:var(--ink-3);margin-bottom:12px}
  /* A band of its own above the story. It is a flex child rather than an overlay, so it reserves
     its height and the text below can never run under it. overflow stays visible so a bubble that
     is entering a round can fall out of the band and over the story as it dissolves. */
  #float{position:relative;flex:none;height:clamp(150px,18vh,208px);z-index:5;
    pointer-events:none;overflow:visible}
  #bubbles{position:absolute;inset:0}
  .more{position:absolute;right:48px;bottom:6px;text-align:right}
  .bub{position:relative;font-family:var(--soft);font-weight:600;font-size:15.5px;line-height:1.4;
    padding:17px 23px;max-width:100%;color:#3f4b5e;
    background:linear-gradient(155deg,rgba(255,255,255,.88),color-mix(in srgb,var(--c) 16%,rgba(255,255,255,.74)));
    backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25);
    box-shadow:0 3px 12px rgba(120,142,178,.14),0 18px 40px rgba(120,142,178,.15),
      inset 0 1px 0 rgba(255,255,255,.85),0 0 0 1px color-mix(in srgb,var(--c) 24%,transparent);
    border-radius:36px 42px 34px 40px;
    animation:bob 7s ease-in-out infinite}
  /* two puffs trailing down-left, toward the paragraph the phrase is about to enter */
  .bub::before,.bub::after{content:'';position:absolute;border-radius:50%;
    background:color-mix(in srgb,var(--c) 15%,rgba(255,255,255,.86));
    backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);
    box-shadow:0 2px 7px rgba(120,142,178,.13),inset 0 1px 0 rgba(255,255,255,.8),
      0 0 0 1px color-mix(in srgb,var(--c) 21%,transparent)}
  .bub::before{width:14px;height:14px;left:22px;bottom:-11px}
  .bub::after{width:8px;height:8px;left:9px;bottom:-25px}
  /* No fill-mode: a lingering `to{transform:none}` would outrank the exit transform below,
     the same way the old infinite bob did. */
  /* Absolutely placed, so the queue shuffling is a transition of top/left rather than a reflow —
     which also means it honours reduced-motion for free, unlike a scripted animation. */
  .bub-wrap{position:absolute;width:min(300px,17.5vw);
    animation:descend .9s cubic-bezier(.22,1,.36,1);
    transition:top 1.05s cubic-bezier(.22,1,.36,1),left 1.05s cubic-bezier(.22,1,.36,1),
      opacity .65s ease,transform .65s ease}
  .bub-wrap:nth-child(even) .bub{animation-duration:8.6s;animation-delay:-2.1s}
  .bub-wrap:nth-child(3n)  .bub{animation-duration:9.7s;animation-delay:-4.3s}
  /* the shape itself drifts, so no two bubbles ever look stamped from one mould */
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-.6deg);border-radius:30px 34px 28px 32px}
    50%{transform:translateY(-8px) rotate(.7deg);border-radius:34px 28px 32px 30px}}
  @keyframes descend{from{opacity:0;transform:translateY(-38px) scale(.92)}to{opacity:1;transform:none}}
  .bub-wrap.going{opacity:0;transform:translate(-10px,140px) scale(.94)}
  .bub b{display:block;font-weight:700;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
    color:color-mix(in srgb,var(--c) 72%,#5a6678);margin-bottom:5px}
  .more{font-family:var(--soft);font-weight:600;font-size:14px;color:var(--ink-3);padding-left:6px}
  #queuecount{font-family:var(--soft);font-weight:600;font-size:19px;color:var(--ink-2);
    padding:0 4px 20px;line-height:1.4}
  #queuecount em{font-style:normal;font-size:26px;font-weight:700;color:#5c6b82}

  /* ---------- transient notes ---------- */
  #toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(14px);z-index:6;
    font-family:var(--soft);font-weight:600;font-size:15px;color:var(--ink-2);
    background:rgba(255,255,255,.9);padding:12px 24px;border-radius:30px;
    box-shadow:0 6px 26px rgba(120,142,178,.18),inset 0 1px 0 #fff;
    opacity:0;pointer-events:none;transition:opacity .5s ease,transform .5s ease}
  #toast.on{opacity:1;transform:translateX(-50%)}

  /* ---------- edit-in-place: double-click a line and type straight into it ---------- */
  .para[contenteditable]{outline:none;cursor:text}
  .para.editing{background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,255,255,.82));
    border-radius:28px;padding:.5em .7em;opacity:1;color:var(--ink);caret-color:#d8a24a;
    box-shadow:0 0 0 2px color-mix(in srgb,#d8a24a 45%,transparent),
      0 6px 24px rgba(120,142,178,.14)}
  /* the how-to rides inside the ring but outside the editable text (pseudo-content can't be typed in) */
  .para.editing::after{content:'type new words into the line · enter weaves them in · esc lets go';
    display:block;margin-top:.6em;font-family:var(--soft);font-weight:600;font-size:12.5px;
    letter-spacing:.08em;text-transform:uppercase;
    color:color-mix(in srgb,#d8a24a 70%,#5a6678)}

  /* ---------- time-lapse close ---------- */
  #lapse{position:fixed;inset:0;z-index:8;background:rgba(247,249,253,.93);
    backdrop-filter:blur(9px);display:none;flex-direction:column;padding:5vh 8vw}
  #lapse.on{display:flex}
  #lapse .lh{font-family:var(--soft);font-weight:600;font-size:14px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink-3);margin-bottom:3vh;display:flex;gap:20px}
  #lapseText{flex:1;overflow:hidden;font-size:clamp(19px,1.85vw,34px);line-height:1.6;max-width:40ch;
    color:var(--ink)}
  #lapseText.swap{animation:swap .75s ease}
  @keyframes swap{from{opacity:.15;filter:blur(7px)}to{opacity:1;filter:none}}
  #lapse .lf{font-family:var(--soft);font-weight:500;font-size:14px;color:var(--ink-3);margin-top:3vh}

  @media (max-width:1100px){
    #main{grid-template-columns:1fr;padding:0 22px 22px}
    #rail{display:none}
    .bub-wrap{width:30vw}
    .more{right:22px}
    header{padding:16px 22px 10px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
      transition-duration:.01ms !important}
  }
</style>
</head>
<body>

<div id="sky"><i></i><i></i><i></i></div>

<header>
  <span class="wordmark"><span class="pip" id="pip"></span>The Loom</span>
  <span class="spacer"></span>
  <span class="meta" id="meta">finding the loom…</span>
</header>

<div id="float"><div id="bubbles"></div></div>

<div id="main">
  <div id="story"></div>
  <div id="rail">
    <div id="illus"><img id="illusA"><img id="illusB"><div class="cap">the scene, as woven</div></div>
    <div class="rail-h">Waiting to be woven</div>
    <div id="queuecount">the room is quiet</div>
  </div>
</div>

<div id="toast"></div>

<div id="lapse">
  <div class="lh"><span id="lapseRound">round</span><span id="lapseKind"></span></div>
  <div id="lapseText"></div>
  <div class="lf">space pauses · ← → steps · esc closes</div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);

/* ---------- where the loom lives ---------- */
const API = (new URLSearchParams(location.search).get('api')
          || localStorage.getItem('loom_api')
          || 'http://192.168.100.69:8082').replace(/\/+$/,'');
localStorage.setItem('loom_api', API);

/* ---------- what we know about the room ----------
   `/state` hands back paragraphs as plain strings with no attribution, so contributor colour has
   to be reconstructed. Every span the server ever shows us goes in the phrase book, and any
   paragraph is painted by finding those phrases in its text. That survives reconnects and splits,
   where cached paragraph indices would not. */
let contributors = {};          // id -> {id, name, colour}
const phrasebook = new Map();   // text -> {text, id, colour}

function learn(text, id){
  if(!text) return;
  const t = String(text).trim();
  if(t.length < 3) return;
  const colour = contributors[id] && contributors[id].colour;
  if(!colour) return;
  phrasebook.set(t, {text:t, id, colour});
}

/* Longest-first so "a stolen accordion" wins over a shorter phrase nested inside it, and
   overlapping claims are dropped rather than nested. */
function paint(text, into){
  const marks = [];
  const phrases = [...phrasebook.values()].sort((a,b)=>b.text.length-a.text.length);
  for(const ph of phrases){
    let from = 0, i;
    while((i = text.indexOf(ph.text, from)) !== -1){
      const end = i + ph.text.length;
      if(!marks.some(m => i < m.end && end > m.start)) marks.push({start:i, end, ...ph});
      from = end;
    }
  }
  marks.sort((a,b)=>a.start-b.start);
  const frag = document.createDocumentFragment();
  let at = 0;
  for(const m of marks){
    if(m.start > at) frag.append(text.slice(at, m.start));
    const s = document.createElement('span');
    s.className = 'who'; s.style.setProperty('--c', m.colour);
    s.dataset.id = m.id; s.textContent = text.slice(m.start, m.end);
    frag.append(s);
    at = m.end;
  }
  if(at < text.length) frag.append(text.slice(at));
  into.replaceChildren(frag);
}

/* ---------- the story ---------- */
let paragraphs = [], paragraphIds = [], liveIdx = 0;
// True from the first `round_start` onward. Before that, paragraph 0 is empty by design (the room
// writes the opening line too — see loom/server.py) and #story shows an invitation instead of prose.
let weavingStarted = false;

// `liveIdx` is the persistent growth edge, set only from the server's authoritative state/round_end/
// split events. `weaving*` is transient — which block a round is *currently* touching, and how — set
// on round_start and cleared on commit/round_rejected/round_end. They're kept apart because a round
// can touch a paragraph that isn't live at all: a deliberate edit of an old paragraph, or a passive
// ripple re-absorbing one. Conflating them under one `.live` treatment would make all three look the
// same on screen.
let weavingBlock = null, weavingKind = null, weavingRetro = false;
const weavingEl = () => $(`.para[data-i="${weavingBlock}"]`);

function renderStory(){
  // the story moved beneath an in-place edit (commit, split, round start) — let go, don't fight it
  if(editEl) cancelEdit(false);
  const host = $('#story');
  host.replaceChildren();
  if(!weavingStarted && paragraphs.length <= 1 && !(paragraphs[0] || '').trim()){
    const p = document.createElement('p');
    p.className = 'para live gathering';
    p.dataset.i = 0;
    p.textContent = 'the loom is listening — throw in the first phrase to begin the story.';
    host.append(p);
    scrollToLive();
    return;
  }
  paragraphs.forEach((text, i) => {
    const p = document.createElement('p');
    let cls = 'para';
    if(i === liveIdx) cls += ' live';
    else if(i === weavingBlock && weavingKind === 'weave' && weavingRetro) cls += ' retro';
    else if(i === weavingBlock && weavingKind === 'ripple') cls += ' rippling';
    else cls += ' settled';
    p.className = cls;
    p.dataset.i = i;
    if(typeof paragraphIds[i] !== 'undefined') p.dataset.id = paragraphIds[i];
    paint(text, p);
    host.append(p);
  });
  scrollToLive();
}

/* ---------- edit-in-place: double-click a line and type straight into it ----------
   The projector is the shared, one-and-only screen the whole room watches, so an edit made here
   is a deliberate operator action, not a per-contributor submission -- it gets its own persisted
   identity (distinct from any phone's), separate from the crowd's live phrases.
   The server only accepts insertions (a phrase for /submit to weave in), never a rewrite, so on
   enter the line is diffed against its committed text: the one contiguous run of new words becomes
   the phrase, where it was typed becomes the `after` placement hint, and a deletion means the
   whole edit is put back with an explanation rather than half-honoured. */
let editEl = null, editOrig = '', editTargetId = null;
let opId = localStorage.getItem('loom_operator_id') || null;

// Mirrors loom/weave.py's split_sentences -- a placement hint, not authoritative; the server
// independently re-derives and bounds-checks `after` against its own split at submit time.
function splitSentences(text){
  const out = [];
  const end = /[.!?]+["”'\)\]]*\s+/g;
  let start = 0, m;
  while ((m = end.exec(text))){ out.push(text.slice(start, m.index + m[0].length)); start = end.lastIndex; }
  if (text.slice(start).trim()) out.push(text.slice(start));
  return out;
}

function startEdit(p, i){
  if(editEl) cancelEdit();
  editEl = p; editOrig = paragraphs[i]; editTargetId = paragraphIds[i];
  // plaintext-only keeps pasted markup out; older engines throw on it, plain true is close enough
  try{ p.contentEditable = 'plaintext-only'; }catch{ p.contentEditable = 'true'; }
  p.classList.add('editing');
  p.addEventListener('keydown', editKeys);
  p.addEventListener('blur', onEditBlur);
  p.focus({preventScroll:true});
  // the double-click selected a word; collapse to its end so the caret sits where they clicked
  const sel = window.getSelection();
  if(sel && sel.rangeCount && p.contains(sel.anchorNode)) sel.collapseToEnd();
}

function cancelEdit(rerender = true){
  if(!editEl) return;
  const p = editEl;
  editEl = null; editOrig = ''; editTargetId = null;
  p.removeEventListener('keydown', editKeys);
  p.removeEventListener('blur', onEditBlur);
  p.removeAttribute('contenteditable');
  p.classList.remove('editing');
  if(rerender) renderStory();   // restore the committed text and contributor paint
}
function onEditBlur(){ cancelEdit(); }
function editKeys(e){
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); commitEdit(); }
  else if(e.key === 'Escape'){ e.preventDefault(); cancelEdit(); }
}

async function commitEdit(){
  if(!editEl) return;
  const edited = editEl.textContent, orig = editOrig, targetId = editTargetId;
  cancelEdit();   // the screen goes back to the committed text; the weave brings the change
  // longest common prefix/suffix -> the one contiguous run that was typed in
  let a = 0;
  const lim = Math.min(orig.length, edited.length);
  while(a < lim && orig[a] === edited[a]) a++;
  let b = 0;
  while(b < lim - a && orig[orig.length - 1 - b] === edited[edited.length - 1 - b]) b++;
  const inserted = edited.slice(a, edited.length - b).replace(/\s+/g, ' ').trim();
  const removed = orig.slice(a, orig.length - b).trim();
  if(removed){ toast('the loom only weaves new words in — deleted ones were put back', 3600); return; }
  if(!inserted) return;
  // which sentence the phrase was typed behind, as the placement hint
  let after = null, at = 0;
  splitSentences(orig).forEach((s, i) => { at += s.length; if(at <= a) after = i; });
  const payload = { text: inserted, target_id: targetId };
  if(after !== null) payload.after = after;
  if(opId) payload.id = opId;
  try {
    const res = await fetch(`${API}/submit`, {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload),
    });
    let j = {};
    try { j = await res.json(); } catch {}
    if(res.status === 200){
      if(j.contributor && j.contributor.id){ opId = j.contributor.id; localStorage.setItem('loom_operator_id', opId); }
      toast(j.target_applied === false
        ? (j.target_reason || 'that line changed before it landed') + ' — joined the live line instead'
        : 'weaving it into that line', 3000);
    } else {
      toast(j.message || j.error || `couldn't send that (HTTP ${res.status})`, 3400);
    }
  } catch {
    toast('couldn\'t reach the loom', 3000);
  }
}

// delegated, not bound per-paragraph -- renderStory() rebuilds #story's children on every commit.
// The live line is editable too: early on the whole story is one live paragraph, and excluding
// it would leave nothing editable at all.
$('#story').addEventListener('dblclick', (e) => {
  const p = e.target.closest('.para');
  if(!p || p === editEl) return;
  const i = Number(p.dataset.i);
  if(!weavingStarted) return;
  if(typeof paragraphIds[i] === 'undefined') return;
  startEdit(p, i);
});

/* ---------- the illustration ----------
   Only ever holds the latest still per paragraph block, from the server's own `images` map / `image`
   events — the server already drops a generation superseded by a newer round before it ever reaches
   the client, so there's no staleness check to redo here. Shows whichever block is currently live. */
let images = {};            // block -> {round, data}
let illusLayer = 'A';

function showIllus(block, animate){
  const info = images[block];
  const host = $('#illus');
  if(!info || !info.data){ host.classList.remove('on'); return; }
  host.classList.add('on');
  const a = $('#illusA'), b = $('#illusB');
  const showEl = illusLayer === 'A' ? b : a, hideEl = illusLayer === 'A' ? a : b;
  if(!animate){
    a.style.transition = 'none'; b.style.transition = 'none';
    a.src = info.data; a.style.opacity = 1;
    b.removeAttribute('src'); b.style.opacity = 0;
    illusLayer = 'A';
    requestAnimationFrame(() => { a.style.transition = ''; b.style.transition = ''; });
    return;
  }
  showEl.onload = () => { showEl.style.opacity = 1; hideEl.style.opacity = 0; };
  showEl.src = info.data;
  illusLayer = illusLayer === 'A' ? 'B' : 'A';
}
const liveEl = () => $(`.para[data-i="${liveIdx}"]`);
function scrollToLive(){
  const el = liveEl();
  if(!el) return;
  const host = $('#story'), ch = host.clientHeight, h = el.offsetHeight;
  // A short paragraph sits centred; a tall one is pulled up under the top fade instead, so the
  // positions still being denoised never dissolve into the bottom edge of the mask.
  const target = h < ch * 0.72 ? el.offsetTop - (ch - h) / 2 : el.offsetTop - ch * 0.12;
  host.scrollTo({top: Math.max(0, target), behavior:'smooth'});
}

/* ---------- the denoise ----------
   Frames are non-monotonic: a position can change back. So age is a count of consecutive frames a
   position has held its token, exactly the `held` signal the decoder converges on — never a
   "filled in yet" test. Rendering is per-position so only what moved is touched. */
let cells = [];                 // [{el, text, age}]
let pinAt = new Map();          // canvas position -> {colour, id}

function resetCanvas(){ cells = []; pinAt = new Map(); }

function renderFrame(tokens){
  const host = weavingEl();
  if(!host) return;
  if(!cells.length) host.replaceChildren();

  while(cells.length < tokens.length){
    const el = document.createElement('span');
    el.className = 'tk';
    host.append(el);
    cells.push({el, text:null, age:0});
  }
  while(cells.length > tokens.length) cells.pop().el.remove();

  for(let i = 0; i < tokens.length; i++){
    const c = cells[i], t = tokens[i];
    if(c.text !== t){ c.text = t; c.age = 0; c.el.textContent = t; }
    else if(c.age < 99) c.age++;

    const pin = pinAt.get(i);
    let cls = 'tk';
    if(pin){
      // round only the ends of a contiguous run by the same contributor
      const before = pinAt.get(i - 1), after = pinAt.get(i + 1);
      cls += ' pin';
      if(!before || before.id !== pin.id) cls += ' rs';
      if(!after  || after.id  !== pin.id) cls += ' re';
    }else{
      cls += ' ' + (c.age >= 4 ? 'fz' : ['v0','v1','v2','v3'][Math.min(c.age, 3)]);
    }
    if(c.el.className !== cls) c.el.className = cls;
    if(pin && c.el.style.getPropertyValue('--c') !== pin.colour)
      c.el.style.setProperty('--c', pin.colour);
  }
}

/* ---------- the queue ---------- */
/* The band holds one row. Position 0 is next to be woven: it sits leftmost and lowest, closest to
   falling out of the band into the paragraph. Later arrivals queue up to its right and ride higher. */
const BAND_X = 2, BAND_GAP = 19.4;
const bubbles = new Map();                       // queue key -> .bub-wrap already on screen
const keyOf = p => p.contributor + '|' + p.at + '|' + p.text;   // `at` alone collides when one
                                                 // person has two phrases stamped the same instant

/* The rail is a descending queue: a phrase settles in from above, the column flows downward, and
   the bubble nearest the story is the next to be woven. Elements are keyed and reused — rebuilding
   the list on every `queue` event would restart every bubble's motion mid-drift. */
function renderQueue(pending){
  const host = $('#bubbles');
  const show = pending.slice(0, 5);
  const want = new Map(show.map(p => [keyOf(p), p]));

  for(const [k, el] of [...bubbles]){
    if(want.has(k)) continue;
    bubbles.delete(k);
    if(el.classList.contains('going')) continue;   // already drifting into the weave
    el.classList.add('going');
    setTimeout(() => el.remove(), 700);
  }

  show.forEach((p, i) => {
    const k = keyOf(p);
    let el = bubbles.get(k);
    if(!el){
      const c = (contributors[p.contributor] && contributors[p.contributor].colour) || '#b9c7dc';
      const name = (contributors[p.contributor] && contributors[p.contributor].name) || '';
      el = document.createElement('div');
      el.className = 'bub-wrap'; el.dataset.text = p.text; el.dataset.key = k;
      const b = document.createElement('div');
      b.className = 'bub'; b.style.setProperty('--c', c);
      if(name){ const n = document.createElement('b'); n.textContent = name; b.append(n); }
      b.append(document.createTextNode(p.text));
      el.append(b); host.append(el);
      bubbles.set(k, el);
    }
    el.style.left = (BAND_X + i * BAND_GAP) + '%';
    el.style.top  = (86 - i * 15) + 'px';
  });

  const extra = pending.length - show.length;
  let more = host.querySelector('.more');
  if(extra > 0){
    if(!more){ more = document.createElement('div'); more.className = 'more'; host.append(more); }
    more.textContent = `+ ${extra} more drifting in`;
  }else if(more) more.remove();

  const n = pending.length;
  $('#queuecount').innerHTML = n === 0
    ? 'the room is quiet'
    : `<em>${n}</em> phrase${n===1?'':'s'} waiting to be woven`;
}

/* ---------- transient notes ---------- */
let toastT = null;
function toast(msg, ms = 3600){
  const el = $('#toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(()=>el.classList.remove('on'), ms);
}

/* ---------- absorbing a snapshot ---------- */
function applyState(s){
  contributors = s.contributors || {};
  paragraphs = s.paragraphs || [];
  paragraphIds = s.paragraph_ids || [];
  liveIdx = s.live || 0;
  weavingBlock = null; weavingKind = null; weavingRetro = false;
  images = s.images || {};
  if(typeof s.round === 'number' && s.round > 0) weavingStarted = true;
  for(const p of (s.pending || [])) learn(p.text, p.contributor);
  resetCanvas();
  renderStory();
  renderQueue(s.pending || []);
  showIllus(liveIdx, false);
  $('#meta').textContent = weavingStarted ? `round ${s.round}` : 'gathering the first phrases…';
}

/* ---------- the stream ----------
   Every event arrives as an unnamed `data:` frame with a `type` field, so this dispatches on the
   payload — addEventListener('commit', …) would never fire. */
let es = null;
function connect(){
  if(es) es.close();
  es = new EventSource(API + '/stream');

  es.onopen = () => { $('#pip').className = 'pip live'; };

  es.onerror = () => {
    // EventSource reconnects on its own, and every reconnect opens with a fresh `state`.
    // Nothing to resume by hand.
    $('#pip').className = 'pip down';
    $('#meta').textContent = 'reaching for the loom…';
  };

  es.onmessage = (e) => {
    let d; try{ d = JSON.parse(e.data); }catch{ return; }
    $('#pip').className = 'pip live';

    switch(d.type){
      case 'state':
        applyState(d);
        break;

      case 'queue':
        for(const p of (d.pending || [])) learn(p.text, p.contributor);
        renderQueue(d.pending || []);
        break;

      case 'round_start': {
        weavingStarted = true;
        weavingBlock = d.block; weavingKind = d.kind; weavingRetro = !!d.retro;
        for(const s of (d.submissions || [])){
          if(s.colour && s.contributor && !contributors[s.contributor])
            contributors[s.contributor] = {id:s.contributor, name:'', colour:s.colour};
          learn(s.text, s.contributor);
        }
        resetCanvas();
        renderStory();
        showIllus(liveIdx, false);
        // the phrases entering this round leave the rail
        const entering = new Set((d.submissions || []).map(s => s.text));
        document.querySelectorAll('.bub-wrap').forEach(w => {
          if(!entering.has(w.dataset.text)) return;
          w.classList.add('going');
          bubbles.delete(w.dataset.key);
          // drop it once it has drifted down into the weave, so the rail closes up behind it
          setTimeout(() => w.remove(), 700);
        });
        $('#meta').textContent = d.retro
          ? `round ${d.round} · revising an earlier line`
          : `round ${d.round} · ${d.kind}`;
        break;
      }

      case 'pins':
        // where each span actually landed once tokenized — colour from step 0, before any frame
        pinAt = new Map();
        for(const sp of (d.spans || [])){
          const c = contributors[sp.id] && contributors[sp.id].colour;
          if(!c || !sp.len) continue;
          for(let k = 0; k < sp.len; k++) pinAt.set(sp.pos + k, {colour:c, id:sp.id});
          learn(sp.text, sp.id);
        }
        break;

      case 'frame':
        renderFrame(d.tokens || []);
        break;

      case 'commit': {
        // authoritative — displayed story text never comes from frames
        for(const sp of (d.spans || [])) learn(sp.text, sp.id);
        paragraphs[d.block] = d.text;
        const flashLanding = !!d.retro;
        weavingBlock = null; weavingKind = null; weavingRetro = false;
        resetCanvas();
        renderStory();
        if(flashLanding){
          // a deliberate edit landing gets a distinct flash from an ordinary live commit
          const el = $(`.para[data-i="${d.block}"]`);
          if(el){ el.classList.add('landed'); setTimeout(() => el.classList.remove('landed'), 1200); }
        }
        break;
      }

      case 'image':
        // a still companion, not video — arrives roughly once per committed round, well after the
        // fact. The server already drops anything superseded before publishing, so just show it.
        images[d.block] = {round: d.round, data: d.data || d.url};
        if(d.block === liveIdx) showIllus(liveIdx, true);
        break;

      case 'round_rejected': {
        const el = $(`.para[data-i="${d.block}"]`);
        if(el){ el.classList.add('rejected'); setTimeout(()=>el.classList.remove('rejected'), 1600); }
        toast('the loom let that one go', 2600);
        weavingBlock = null; weavingKind = null; weavingRetro = false;
        resetCanvas();
        renderStory();
        break;
      }

      case 'split':
        // paragraph indices moved — re-render wholesale from the state carried in the event
        applyState(d.state);
        break;

      case 'round_end':
        applyState(d.state);
        break;

      case 'error':
        toast('a thread slipped — the story is unchanged', 4200);
        break;
    }
  };
}
connect();

/* ---------- the close: scrub the whole weave ---------- */
let lapse = {on:false, revs:[], i:0, timer:null, paused:false};

async function openLapse(){
  try{
    const r = await fetch(API + '/history');
    const j = await r.json();
    lapse.revs = j.revisions || [];
  }catch{ toast('could not reach the history'); return; }
  if(!lapse.revs.length){ toast('nothing woven yet'); return; }
  lapse.on = true; lapse.i = 0; lapse.paused = false;
  $('#lapse').classList.add('on');
  showRev();
  step();
}
function closeLapse(){
  lapse.on = false; clearTimeout(lapse.timer);
  $('#lapse').classList.remove('on');
}
function showRev(){
  const r = lapse.revs[lapse.i];
  if(!r) return;
  for(const s of (r.spans || [])) learn(s.text, s.id);
  $('#lapseRound').textContent = `round ${r.n} of ${lapse.revs.length}`;
  $('#lapseKind').textContent = r.kind;
  const t = $('#lapseText');
  t.classList.remove('swap'); void t.offsetWidth; t.classList.add('swap');
  paint(r.after, t);
}
function step(){
  clearTimeout(lapse.timer);
  if(!lapse.on || lapse.paused) return;
  lapse.timer = setTimeout(() => {
    if(lapse.i < lapse.revs.length - 1){ lapse.i++; showRev(); step(); }
  }, 1700);
}
addEventListener('keydown', e => {
  if(editEl) return;   // every key belongs to the line being edited — 't' must not open the lapse
  if(e.key === 't' || e.key === 'T'){ lapse.on ? closeLapse() : openLapse(); return; }
  if(!lapse.on) return;
  if(e.key === 'Escape') closeLapse();
  else if(e.key === ' '){ e.preventDefault(); lapse.paused = !lapse.paused; step(); }
  else if(e.key === 'ArrowRight'){ lapse.paused = true; if(lapse.i < lapse.revs.length-1){ lapse.i++; showRev(); } }
  else if(e.key === 'ArrowLeft'){ lapse.paused = true; if(lapse.i > 0){ lapse.i--; showRev(); } }
});
</script>
</body>
</html>
