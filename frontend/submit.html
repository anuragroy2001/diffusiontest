<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Loom — throw in a phrase</title>
<style>
  :root{
    --bg:#0b0d11; --panel:#161a21; --line:#2a303c; --fg:#e8ebf1; --dim:#8b93a1;
    --accent:#7aa2f7; --ok:#7ec699; --bad:#f07178;
    font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;background:var(--bg);color:var(--fg);
    display:flex;flex-direction:column;align-items:center;padding:24px 16px 48px}
  .wrap{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
  h1{font-size:20px;margin:6px 0 0}
  p.sub{margin:0;color:var(--dim);font-size:13px}
  label{font-size:13px;color:var(--dim);display:block;margin-bottom:5px}
  textarea,input[type=text]{width:100%;font:16px/1.4 inherit;color:var(--fg);background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:12px;outline:none;resize:vertical}
  textarea{min-height:88px}
  textarea:focus,input:focus{border-color:var(--accent)}
  .count{font-size:11px;color:var(--dim);text-align:right;margin-top:3px}
  .count.over{color:var(--bad)}
  button{width:100%;padding:14px;font:16px/1 inherit;font-weight:600;color:#0b0d11;
    background:var(--accent);border:none;border-radius:10px;cursor:pointer}
  button:active{transform:scale(.99)}
  button:disabled{opacity:.5;cursor:default}
  .msg{border-radius:10px;padding:12px 14px;font-size:14px;display:none;gap:10px;align-items:center}
  .msg.show{display:flex}
  .msg.ok{background:#132a1e;border:1px solid #1f4c33;color:var(--ok)}
  .msg.err{background:#2a1416;border:1px solid #5a2c30;color:var(--bad)}
  .swatch{width:20px;height:20px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.25)}
  .field-err{color:var(--bad);font-size:12px;margin-top:4px;display:none}
  .field-err.show{display:block}
  .whoami{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
  .whoami .swatch{width:12px;height:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>The Loom</h1>
  <p class="sub">Throw a phrase into the room's story. Weird is good.</p>

  <div class="whoami" id="whoami" style="display:none">
    <span class="swatch" id="whoamiSwatch"></span>
    <span id="whoamiText"></span>
  </div>

  <form id="form">
    <div>
      <label for="text">your phrase</label>
      <textarea id="text" maxlength="240" placeholder="a stolen accordion…" autofocus></textarea>
      <div class="count" id="textCount">0 / 120</div>
      <div class="field-err" id="textErr"></div>
    </div>
    <div style="margin-top:12px">
      <label for="name">name (optional)</label>
      <input type="text" id="name" maxlength="48" placeholder="Ada">
      <div class="count" id="nameCount">0 / 24</div>
      <div class="field-err" id="nameErr"></div>
    </div>
    <div style="margin-top:16px">
      <button type="submit" id="submitBtn">throw it in</button>
    </div>
  </form>

  <div class="msg" id="msg"></div>
</div>

<script>
// Backend base URL. Per frontend-spec.md this LAN/Tailscale IP can change on server restart —
// the server prints the new one on startup. Edit this one constant if it does.
const API = "http://192.168.100.69:8082";

const $ = s => document.querySelector(s);
const textEl = $('#text'), nameEl = $('#name'), form = $('#form'), submitBtn = $('#submitBtn');
const msgEl = $('#msg'), textErrEl = $('#textErr'), nameErrEl = $('#nameErr');
const whoamiEl = $('#whoami'), whoamiSwatch = $('#whoamiSwatch'), whoamiText = $('#whoamiText');

const TEXT_MAX = 120, NAME_MAX = 24;

/* ---- persisted identity: same device keeps the same server-assigned colour ---- */
let myId = localStorage.getItem('loom_id') || null;
let myColour = localStorage.getItem('loom_colour') || null;
const savedName = localStorage.getItem('loom_name') || '';
if (savedName) nameEl.value = savedName;

function refreshWhoami(){
  if (myColour) {
    whoamiSwatch.style.background = myColour;
    whoamiText.textContent = 'you are ' + (savedNameNow() ? `“${savedNameNow()}” ` : '') + 'in this colour';
    whoamiEl.style.display = 'flex';
  } else {
    whoamiEl.style.display = 'none';
  }
}
function savedNameNow(){ return localStorage.getItem('loom_name') || ''; }
refreshWhoami();

/* ---- live char counters ---- */
function updateCount(el, countEl, max){
  const n = el.value.length;
  countEl.textContent = `${n} / ${max}`;
  countEl.classList.toggle('over', n > max);
}
textEl.addEventListener('input', () => updateCount(textEl, $('#textCount'), TEXT_MAX));
nameEl.addEventListener('input', () => updateCount(nameEl, $('#nameCount'), NAME_MAX));
updateCount(textEl, $('#textCount'), TEXT_MAX);
updateCount(nameEl, $('#nameCount'), NAME_MAX);

function showMsg(kind, html){
  msgEl.className = 'msg show ' + kind;
  msgEl.innerHTML = html;
}
function clearFieldErrs(){
  textErrEl.classList.remove('show'); textErrEl.textContent = '';
  nameErrEl.classList.remove('show'); nameErrEl.textContent = '';
}
function fieldErr(el, text){
  el.textContent = text; el.classList.add('show');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearFieldErrs();

  // client-side validation before any network call (item 4)
  const rawText = textEl.value;
  const text = rawText.trim().replace(/\s+/g, ' ');
  const name = nameEl.value.trim();

  let ok = true;
  if (!text) { fieldErr(textErrEl, 'say something first.'); ok = false; }
  else if (text.length > TEXT_MAX) { fieldErr(textErrEl, `too long — ${text.length}/${TEXT_MAX}.`); ok = false; }
  if (name.length > NAME_MAX) { fieldErr(nameErrEl, `too long — ${name.length}/${NAME_MAX}.`); ok = false; }
  if (!ok) return;

  submitBtn.disabled = true;
  submitBtn.textContent = 'sending…';

  const payload = { text, name };
  if (myId) payload.id = myId;   // send back id so the same contributor keeps their colour

  try {
    const res = await fetch(`${API}/submit`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });

    if (res.status === 200) {
      const j = await res.json();
      const c = j.contributor || {};
      if (c.id) { myId = c.id; localStorage.setItem('loom_id', myId); }
      if (c.colour) { myColour = c.colour; localStorage.setItem('loom_colour', myColour); }
      if (name) localStorage.setItem('loom_name', name);
      refreshWhoami();

      const depthNote = (typeof j.depth === 'number') ? ` — ${j.depth} phrase${j.depth === 1 ? '' : 's'} in the queue.` : '';
      showMsg('ok', `<span class="swatch" style="background:${c.colour || '#888'}"></span>
        <span>in the loom now.${depthNote}</span>`);

      // don't lock the form (item 5) — clear the phrase so the box is ready for the next one,
      // but keep the name (name is a device-level setting, not a per-submission field)
      textEl.value = '';
      updateCount(textEl, $('#textCount'), TEXT_MAX);
      textEl.focus();

    } else if (res.status === 429) {
      showMsg('err', `hang on — your last ones haven't landed yet.`);
      // deliberately do not clear textEl — let them retry without losing what they typed
    } else if (res.status === 400) {
      let detail = '';
      try { const j = await res.json(); detail = j.message || j.error || ''; } catch {}
      showMsg('err', detail || 'that phrase was rejected — check it isn\'t empty.');
    } else {
      let detail = '';
      try { const j = await res.json(); detail = j.message || j.error || ''; } catch {}
      showMsg('err', detail || `something went wrong (HTTP ${res.status}). try again.`);
    }
  } catch (err) {
    showMsg('err', `couldn't reach the loom — check you're on the same wifi, then try again.`);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'throw it in';
  }
});
</script>
</body>
</html>
